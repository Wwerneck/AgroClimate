[project]
name = "agroclimate-data-platform"
version = "0.1.0"
description = "Plataforma de Engenharia de Dados para clima aplicado ao agronegocio brasileiro."
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.1",
  "pyarrow>=15.0.0",
  "pandas>=2.2.0",
  "psycopg[binary]>=3.1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.5.0", "black>=24.0.0"]
spark = ["pyspark>=3.5.0"]
dashboard = ["streamlit>=1.36.0", "plotly>=5.22.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 120
target-version = ["py310"]
